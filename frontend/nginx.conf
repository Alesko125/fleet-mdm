server {
    listen 80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безпеки задаються і тут: цей контейнер може стояти за іншим
    # проксі, і панель не має лишатися без політики вмісту через чужу
    # конфігурацію. `add_header` у location скасовує успадковані, тож повний
    # набір повторюється в кожному блоці.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        try_files $uri =404;
    }

    # SPA: будь-який маршрут віддає index.html
    location / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=(), display-capture=()" always;
        try_files $uri $uri/ /index.html;
    }
}
