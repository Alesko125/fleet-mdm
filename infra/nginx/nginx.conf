worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # У журнал іде $uri (лише шлях) замість $request_uri (шлях із запитом):
    # браузерний WebSocket не вміє задавати заголовок Authorization, тож
    # токен доступу передається параметром URL — і з $request_uri осідав би
    # відкритим текстом у логах nginx.
    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent",'
        '"rid":"$http_x_request_id"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Стеля за замовчуванням — компактна; великі тіла дозволені точково,
    # лише там, де справді передаються файли.
    client_max_body_size 1m;
    client_body_timeout 60s;
    client_header_timeout 20s;
    large_client_header_buffers 4 16k;

    # Груба стеля частоти на рівні периметра. Точні ліміти рахує застосунок
    # (він знає, хто саме звертається); ця — щоб очевидний флуд не доходив
    # до Python взагалі.
    limit_req_zone $binary_remote_addr zone=perimeter:16m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:8m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conns:8m;

    upstream fleet_api {
        server api:8000;
        keepalive 32;
    }

    upstream fleet_frontend {
        server frontend:80;
        keepalive 8;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- HTTP: лише ACME + редирект на HTTPS --------------------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS --------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Покладіть сертифікати сюди (Let's Encrypt або власний CA):
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Лише TLS 1.2/1.3 і лише AEAD-шифри з forward secrecy.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve X25519:prime256v1:secp384r1;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        # Квитки сесій без ротації ключа ламають forward secrecy.
        ssl_session_tickets off;

        # OCSP stapling: клієнт перевіряє відкликання, не ходячи до CA сам.
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 127.0.0.11 valid=300s ipv6=off;
        resolver_timeout 5s;

        # `always` — щоб заголовки були і на сторінках помилок.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=(), display-capture=()" always;

        limit_conn conns 64;

        # --- API ---
        location /api/ {
            limit_req zone=perimeter burst=60 nodelay;
            proxy_pass http://fleet_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            # Заголовки безпеки ставить сам застосунок; тут не дублюємо, щоб
            # `add_header` у location не скасував успадковані з server.
        }

        # Вхід і реєстрація — окремий, значно жорсткіший периметр.
        location ~ ^/api/v1/(auth/login|auth/password|enroll|device/auth|device/key) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://fleet_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Вивантаження APK і файлів — єдине місце з великим тілом.
        location ~ ^/api/v1/(apks|devices/[^/]+/files) {
            client_max_body_size 512m;
            client_body_timeout 300s;
            limit_req zone=perimeter burst=20 nodelay;
            proxy_pass http://fleet_api;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location = /health {
            access_log off;
            proxy_pass http://fleet_api;
            proxy_set_header Host $host;
        }

        # --- WebSocket (командний канал, віддалена підтримка) ---
        location /ws/ {
            proxy_pass http://fleet_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Веб-панель (окремий контейнер зі зібраною статикою) ---
        location / {
            proxy_pass http://fleet_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Політика вмісту для панелі. Скрипти — лише власні файли:
            # ані inline, ані сторонні CDN, тож знайдений XSS не має де
            # виконатись і нікуди вивезти дані. Той самий набір, що ставить
            # застосунок для своїх відповідей, — тут для статики.
            add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=(), display-capture=()" always;
        }
    }
}
